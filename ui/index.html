<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>网易云导出</title>
<style>
:root{--bg:#fff;--card:#f5f5f7;--text:#1d1d1f;--muted:#6e6e73;--accent:#fa2d48;--line:#e5e5ea;--ok:#1db954;--warn:#c98a00}
@media (prefers-color-scheme: dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#8e8e93;--line:#2c2c2e;--ok:#30d158;--warn:#ffd60a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",system-ui,sans-serif;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));min-height:100vh}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px;word-break:break-all}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600}
button{padding:12px 16px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;min-height:44px}
button.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
button.small{padding:8px 12px;min-height:34px;font-size:13px}
button:disabled{opacity:.4}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:15px/1.4 inherit;font-family:inherit;outline:none}
textarea{min-height:88px;resize:vertical;font-size:13px}
input:focus,textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{flex:1}
.row > button{flex:0 0 auto}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.seg button{flex:1 0 auto;padding:9px 14px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line);font-size:13.5px;min-height:38px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.field{margin-bottom:8px}
.qr-wrap{text-align:center}
.qr-wrap img{width:min(62vw,250px);height:auto;display:block;margin:10px auto 6px;background:#fff;padding:10px;border-radius:12px}
.state{font-size:13px;min-height:20px;text-align:center;color:var(--muted);margin-top:6px}
.state.err{color:var(--accent)}
.state.ok{color:var(--ok)}
.list{max-height:min(48vh,400px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-top:1px solid var(--line);font-size:14px}
.item:first-child{border-top:0}
.item .n{flex:1;word-break:break-word}
.item .c{color:var(--muted);font-size:12.5px;white-space:nowrap;flex:0 0 auto}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-right:6px}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:18px 0}
.hint{color:var(--muted);font-size:12px;margin-top:8px;text-align:center;line-height:1.6}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.progress > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
</style>
<script>
/* 兜底：脚本解析或运行出错时，把错误显示在页面顶部，避免“点了没反应却看不到原因” */
window.addEventListener('error', e => {
  const el = document.getElementById('sub');
  if (el) el.textContent = '界面脚本出错：' + (e.message || '未知错误');
});
window.addEventListener('unhandledrejection', e => {
  const el = document.getElementById('sub');
  if (el) el.textContent = '请求失败：' + ((e.reason && (e.reason.message || e.reason)) || '未知错误');
});
</script>
</head>
<body>
<h1>网易云导出</h1>
<div class="sub" id="sub">正在检查登录状态…</div>

<section class="card" id="loginCard">
  <h2>登录</h2>
  <div class="seg" id="tabs">
    <button data-m="qr" class="on">扫码</button>
    <button data-m="phone">手机号</button>
    <button data-m="email">邮箱</button>
    <button data-m="cookie">Cookie</button>
  </div>
  <div id="pane-qr">
    <div class="row"><button id="btnLogin">生成二维码</button></div>
    <div id="qrBox" class="qr-wrap"></div>
    <div class="hint">扫码后需在手机端确认；若提示环境异常，改用 Cookie</div>
  </div>
  <div id="pane-phone" hidden>
    <div class="field"><input id="phone" inputmode="numeric" placeholder="手机号"></div>
    <div class="field"><input id="phonePwd" type="password" placeholder="密码"></div>
    <div class="row"><button class="ghost" id="btnPhonePwd">密码登录</button></div>
    <div class="row" style="margin-top:8px">
      <input id="smsCode" inputmode="numeric" placeholder="短信验证码">
      <button class="ghost" id="btnSmsSent">获取</button>
    </div>
    <div class="row" style="margin-top:8px"><button id="btnPhoneSms">验证码登录</button></div>
  </div>
  <div id="pane-email" hidden>
    <div class="field"><input id="email" inputmode="email" placeholder="邮箱"></div>
    <div class="field"><input id="emailPwd" type="password" placeholder="密码"></div>
    <button id="btnEmail">邮箱登录</button>
  </div>
  <div id="pane-cookie" hidden>
    <div class="field"><textarea id="cookieText" placeholder="粘贴 MUSIC_U=... 或只贴 MUSIC_U 的值"></textarea></div>
    <div class="row"><button id="btnCookie">用 Cookie 登录</button></div>
    <div class="hint">最稳的方式，不受扫码风控影响</div>
  </div>
  <div class="state" id="state"></div>
</section>

<section class="card" id="mainCard" hidden>
  <div class="seg" id="mainTabs">
    <button data-v="playlists" class="on">歌单</button>
    <button data-v="albums">收藏专辑</button>
    <button data-v="favlist">收藏歌单</button>
    <button data-v="ranking">听歌排行</button>
    <button data-v="special">专项统计</button>
  </div>

  <!-- 歌单 -->
  <div id="view-playlists">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0;flex:1">我的歌单</h2>
      <button class="ghost small" id="btnPrivacy">隐私模式</button>
      <button class="ghost small" id="btnRefresh">刷新</button>
    </div>
    <div class="seg" id="dispModes" style="margin-bottom:8px">
      <button data-d="raw" class="on">原始</button>
      <button data-d="mark">标记不可见</button>
      <button data-d="esc">转义</button>
      <button data-d="cp">U+ 码点</button>
      <button data-d="skeleton">去组合符</button>
    </div>
    <div class="list" id="list"><div class="empty">加载中…</div></div>
    <div class="row" style="margin-top:10px">
      <button id="btnAllCsv">全部导出 CSV</button>
      <button class="ghost" id="btnAllMd">全部导出 MD</button>
    </div>
    <div class="progress"><i id="batchBar"></i></div>
    <div class="state" id="batchState"></div>
    <div class="row" style="margin-top:8px"><button class="ghost" id="btnZip">打包成 zip</button></div>
    <div class="state" id="zipState"></div>
  </div>

  <!-- 收藏专辑 -->
  <div id="view-albums" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0;flex:1">收藏专辑</h2>
      <button class="ghost small" id="btnAlbumCsv">导出 CSV</button>
    </div>
    <div class="list" id="albums"><div class="empty">点上方「收藏专辑」加载</div></div>
    <div class="state" id="albumState"></div>
  </div>

  <!-- 排行 -->
  <div id="view-favlist" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0;flex:1">收藏歌单</h2>
      <button class="ghost small" id="btnFavCsv">导出 CSV</button>
    </div>
    <div class="list" id="favlist"><div class="empty">加载中…</div></div>
    <div class="state" id="favState"></div>
  </div>

  <div id="view-ranking" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0;flex:1">听歌排行</h2>
      <button class="ghost small" id="btnRankCsv">导出 CSV</button>
    </div>
    <div class="seg" style="margin-bottom:8px">
      <button data-r="all" class="on">全部时间</button>
      <button data-r="week">最近一周</button>
    </div>
    <div class="list" id="ranking"><div class="empty">点上方「听歌排行」加载</div></div>
    <div class="state" id="rankState"></div>
  </div>

  <div id="view-special" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0;flex:1">专项统计</h2>
      <button class="ghost small" id="btnResetStats">重置</button>
    </div>
    <div class="stats" id="specialStats"></div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" id="btnSpecialList">查看明细</button>
      <button class="ghost" id="btnSpecialCsv">导出清单 CSV</button>
    </div>
    <div class="list" id="specialList" style="margin-top:8px"></div>
    <div class="hint">统计来自本次运行中导出过的歌单；执行「全部导出 CSV」后覆盖最完整</div>
    <div class="state" id="specialState"></div>
  </div>

  <div class="row" style="margin-top:12px"><button class="ghost" id="btnLogout">退出登录</button></div>
</section>

<section class="card" id="albumDetailCard" hidden>
  <div class="row" style="justify-content:space-between;margin-bottom:6px">
    <button class="ghost small" id="btnAlbumBack">← 返回</button>
    <button class="ghost small" id="btnAlbumExportCsv">导出 CSV</button>
    <button class="ghost small" id="btnAlbumExportMd">导出 MD</button>
  </div>
  <h2 id="albumTitle" style="margin:0 0 2px">专辑</h2>
  <div class="sub" id="albumMeta" style="margin:0 0 8px"></div>
  <div class="list" id="albumTracks"><div class="empty">加载中…</div></div>
  <div class="state" id="albumExportState"></div>
</section>

<section class="card" id="detailCard" hidden>
  <div class="row" style="justify-content:space-between;margin-bottom:6px">
    <button class="ghost small" id="btnBack">← 返回</button>
    <button class="ghost small" id="btnExportCsv">导出 CSV</button>
    <button class="ghost small" id="btnExportMd">导出 MD</button>
  </div>
  <h2 id="detailTitle" style="margin:0 0 2px">歌单</h2>
  <div class="sub" id="detailMeta" style="margin:0 0 8px"></div>
  <div class="list" id="tracks"><div class="empty">加载中…</div></div>
  <div class="state" id="exportState"></div>
</section>

<script>
const inv = (cmd, args = {}) => window.__TAURI__.core.invoke(cmd, args);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let uid = 0, nickname = '', pollTimer = null, busy = false;
let PLAYLISTS = [], ALBUMS = [], RANK = [], RANK_WEEK = false, currentView = 'playlists', currentId = 0;
let ACC = { down: 0, otherVersion: 0, special: 0, nonLatin: 0, total: 0, playlists: 0 };
let DISP = 'raw', PRIVACY = false;
let FAVLIST = [];

const INVISIBLE = cp => cp < 0x20 || cp === 0x7f || (cp >= 0x200b && cp <= 0x200f) ||
  (cp >= 0x202a && cp <= 0x202e) || (cp >= 0x2066 && cp <= 0x2069) || cp === 0xfeff || cp === 0xad ||
  (cp >= 0x0300 && cp <= 0x036f);

function disp(s) {
  const t = String(s ?? '');
  if (DISP === 'raw') return t;
  if (DISP === 'mark') return t.replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff\u00ad]/g,
    c => '⟨U+' + c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0') + '⟩');
  if (DISP === 'esc') return [...t].map(c => { const cp = c.codePointAt(0); return INVISIBLE(cp) ? '\\u' + cp.toString(16).toUpperCase().padStart(4, '0') : c; }).join('');
  if (DISP === 'cp') return [...t].map(c => 'U+' + c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')).join(' ');
  if (DISP === 'skeleton') return t.replace(/[\p{Mn}\p{Mc}\p{Cf}]/gu, '');
  return t;
}

function maskPl(name, idx) { return PRIVACY ? `歌单 ${String(idx + 1).padStart(3, '0')}` : name; }
function maskNick() { return PRIVACY ? '账号 1' : nickname; }

function setDisp(m) {
  DISP = m;
  document.querySelectorAll('#dispModes button').forEach(b => b.classList.toggle('on', b.dataset.d === m));
  if (PLAYLISTS.length) renderPlaylists();
  if ($('detailCard').hidden === false) { /* 详情需重新拉取才刷新，忽略 */ }
}

function togglePrivacy() {
  PRIVACY = !PRIVACY;
  $('btnPrivacy').textContent = PRIVACY ? '隐私：开' : '隐私模式';
  $('sub').textContent = PRIVACY ? '已登录（隐私模式）' : (nickname ? `已登录：${nickname}（uid ${uid}）` : '已登录');
  if (PLAYLISTS.length) renderPlaylists();
}

function accStats(st) {
  if (!st) return;
  ACC.down += st.down || 0;
  ACC.otherVersion += st.otherVersion || 0;
  ACC.special += st.special || 0;
  ACC.nonLatin += st.nonLatin || 0;
  ACC.total += st.total || 0;
  ACC.playlists += 1;
  renderSpecial();
}

function renderSpecial() {
  const el = $('specialStats');
  if (!el) return;
  el.innerHTML = [
    ['已导出歌单', ACC.playlists],
    ['曲目合计', ACC.total],
    ['仅其他版本可播', ACC.otherVersion],
    ['特殊字符命名', ACC.special],
    ['非拉丁文字', ACC.nonLatin],
    ['已下架（保守估计）', ACC.down],
  ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}

const fmtDur = ms => { if (!ms || ms <= 0) return '--:--'; const t = Math.round(ms/1000); return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; };
const setState = (id, text, kind='') => { const el = $(id); if (!el) return; el.textContent = text || ''; el.className = 'state' + (kind ? ' ' + kind : ''); };

function stopPoll(){ if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

/* ---------- 登录 ---------- */
function switchLoginTab(m){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  ['qr','phone','email','cookie'].forEach(k => { $('pane-'+k).hidden = k !== m; });
  setState('state','');
}

async function afterLogin(){ stopPoll(); setState('state','登录成功','ok'); setTimeout(()=>checkAccount(), 300); }

async function checkAccount(silent=false){
  try {
    const a = await inv('account');
    if (a.logged) {
      uid = a.uid || 0; nickname = a.nickname || '';
      $('sub').textContent = `已登录：${nickname}（uid ${uid}）`;
      $('loginCard').hidden = true; $('mainCard').hidden = false;
      await loadPlaylists(silent);
    } else {
      $('sub').textContent = '未登录';
      $('loginCard').hidden = false; $('mainCard').hidden = true;
    }
  } catch (e) {
    $('sub').textContent = '未登录';
    if (!silent) setState('state','检查登录态失败：'+e,'err');
  }
}

async function startQr(){
  if (busy) return;
  busy = true; $('btnLogin').disabled = true; stopPoll(); $('qrBox').innerHTML = '';
  setState('state','正在生成二维码…');
  try {
    const q = await inv('qr_new');
    $('qrBox').innerHTML = `<img src="${q.img}" alt="二维码">`;
    setState('state','等待扫码…');
    pollTimer = setInterval(async () => {
      try {
        const s = await inv('qr_poll');
        if (s.code === 802) setState('state','已扫码，请在手机上确认…');
        else if (s.code === 803) { await afterLogin(); $('qrBox').innerHTML=''; }
        else if (s.code === 800 || s.code === 8821) { stopPoll(); $('qrBox').innerHTML=''; setState('state','二维码失效或被风控，建议用 Cookie 登录','err'); }
      } catch (e) { stopPoll(); setState('state','轮询失败：'+e,'err'); }
    }, 2000);
  } catch (e) { setState('state','生成二维码失败：'+e,'err'); }
  finally { busy = false; $('btnLogin').disabled = false; }
}

async function runLogin(cmd, args){
  setState('state','登录中…');
  try { const r = await inv(cmd, args||{}); if (r && r.ok) await afterLogin(); else setState('state','登录失败','err'); }
  catch (e) { setState('state', String(e), 'err'); }
}

/* ---------- 歌单 ---------- */
async function loadPlaylists(silent=false){
  if (!silent) $('list').innerHTML = '<div class="empty">加载中…</div>';
  try {
    const r = await inv('playlists', { uid });
    PLAYLISTS = r.items || [];
    FAVLIST = PLAYLISTS.filter(p => !p.mine);
    renderPlaylists();
    if (PRIVACY) $('sub').textContent = `已登录（隐私模式）· 歌单 ${r.total} 个`;
    else $('sub').textContent = `已登录：${nickname}（uid ${uid}）· 歌单 ${r.total} 个`;
  } catch (e) { $('list').innerHTML = `<div class="empty">加载失败：${esc(e)}</div>`; }
}

function renderPlaylists() {
  $('list').innerHTML = PLAYLISTS.length ? PLAYLISTS.map((p, i) => {
    const tags = [];
    if (!p.mine) tags.push('<span class="badge">收藏</span>');
    if (p.privacy === 10) tags.push('<span class="badge">私密</span>');
    return `<div class="item" data-id="${p.id}" data-name="${esc(p.name)}" style="cursor:pointer"><span class="n">${tags.join('')}${esc(maskPl(disp(p.name), i))}</span><span class="c">${p.count} 首 ›</span></div>`;
  }).join('') : '<div class="empty">没有歌单</div>';
  document.querySelectorAll('#list [data-id]').forEach(el => el.onclick = () => openPlaylist(Number(el.dataset.id), el.dataset.name));
}

async function openPlaylist(id, name){
  currentId = id;
  $('detailCard').hidden = false; $('mainCard').hidden = true;
  $('detailTitle').textContent = name || '歌单';
  $('detailMeta').textContent = '正在拉取曲目与厂牌…';
  $('tracks').innerHTML = '<div class="empty">加载中…（曲目多时需要一会儿）</div>';
  setState('exportState','');
  try {
    const d = await inv('playlist_detail', { id });
    const rows = d.rows || [];
    $('detailTitle').textContent = d.name || name;
    $('detailMeta').textContent = `曲目 ${d.count || rows.length} 首`;
    $('tracks').innerHTML = rows.length ? rows.map((r,i) => {
      const flag = r.ncr ? '<span class="badge">仅其他版本</span>' : '';
      return `<div class="item"><span class="n">${i+1}. ${flag}${esc(disp(r.name))}<br><span style="color:var(--muted);font-size:12px">${esc(r.ar)} · ${esc(r.al)} · ${esc(r.company||'未标注厂牌')}</span></span><span class="c">${fmtDur(r.dur)}</span></div>`;
    }).join('') : '<div class="empty">没有曲目</div>';
  } catch (e) { $('detailMeta').textContent=''; $('tracks').innerHTML = `<div class="empty">加载失败：${esc(e)}</div>`; }
}

/* ---------- 专辑详情 ---------- */
let currentAlbum = 0;

async function openAlbum(id, name) {
  currentAlbum = id;
  $('albumDetailCard').hidden = false; $('mainCard').hidden = true;
  $('albumTitle').textContent = name || '专辑';
  $('albumMeta').textContent = '正在拉取曲目…';
  $('albumTracks').innerHTML = '<div class="empty">加载中…</div>';
  setState('albumExportState', '');
  try {
    const d = await inv('album_detail', { id });
    $('albumTitle').textContent = d.name || name;
    const t = d.publishTime ? new Date(d.publishTime).toISOString().slice(0, 10) : '—';
    $('albumMeta').textContent = `${d.artists || '未知'} · ${d.company || '未标注厂牌'} · ${t} · ${d.count} 首`;
    const rows = d.rows || [];
    $('albumTracks').innerHTML = rows.length ? rows.map((r, i) =>
      `<div class="item"><span class="n">${i+1}. ${esc(disp(r.name))}<br><span style="color:var(--muted);font-size:12px">${esc(r.ar || d.artists)} · ${esc(r.al)}</span></span><span class="c">${fmtDur(r.dur)}</span></div>`
    ).join('') : '<div class="empty">专辑没有曲目</div>';
  } catch (e) {
    $('albumMeta').textContent = '';
    $('albumTracks').innerHTML = `<div class="empty">加载失败：${esc(e)}</div>`;
  }
}

async function exportAlbum(format) {
  if (!currentAlbum) return;
  setState('albumExportState', '导出中…');
  try {
    const r = await inv('export_album', { id: currentAlbum, format });
    setState('albumExportState', `已导出 ${r.count} 首：${r.paths.join(' / ')}`, 'ok');
  } catch (e) { setState('albumExportState', '导出失败：' + e, 'err'); }
}

/* ---------- 收藏歌单 ---------- */
function renderFavlist() {
  $('favlist').innerHTML = FAVLIST.length ? FAVLIST.map((p, i) =>
    `<div class="item"><span class="n">${esc(maskPl(disp(p.name), i))}<br><span style="color:var(--muted);font-size:12px">${esc(p.creator || '未知作者')}</span></span><span class="c">${p.count} 首</span></div>`
  ).join('') : '<div class="empty">没有收藏歌单</div>';
  setState('favState', `共 ${FAVLIST.length} 个`, 'ok');
}

async function exportFavlist() {
  if (!FAVLIST.length) return;
  const e = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = '序号,歌单,作者,曲目数,歌单ID\n';
  const rows = FAVLIST.map((p, i) => [i + 1, e(p.name), e(p.creator), p.count, p.id].join(',')).join('\n');
  try {
    const r = await inv('save_text', { name: '表格/收藏歌单.csv', content: '\ufeff' + head + rows + '\n' });
    setState('favState', '已导出：' + r.paths.join(' / '), 'ok');
  } catch (e2) { setState('favState', '导出失败：' + e2, 'err'); }
}

/* ---------- 导出 ---------- */
async function exportOne(id, format){
  return inv('export_playlist', { id, format });
}

async function exportAll(format){
  if (!PLAYLISTS.length) return;
  const btnCsv = $('btnAllCsv'), btnMd = $('btnAllMd');
  btnCsv.disabled = true; btnMd.disabled = true;
  $('batchBar').style.width = '0%';
  let ok = 0, fail = 0;
  const t0 = Date.now();
  for (let i = 0; i < PLAYLISTS.length; i++) {
    const p = PLAYLISTS[i];
    const elapsed = Math.round((Date.now()-t0)/1000);
    $('batchBar').style.width = Math.round((i / PLAYLISTS.length) * 100) + '%';
    setState('batchState', `导出中 ${i+1}/${PLAYLISTS.length}：${p.name}（耗时 ${elapsed}s，成功 ${ok} 失败 ${fail}）`);
    try { const r = await exportOne(p.id, format); accStats(r.stats); ok++; } catch (e) { fail++; }
  }
  $('batchBar').style.width = '100%';
  setState('batchState', `完成：成功 ${ok}，失败 ${fail}，共 ${Math.round((Date.now()-t0)/1000)} 秒`, fail ? '' : 'ok');
  btnCsv.disabled = false; btnMd.disabled = false;
}

/* ---------- 收藏专辑 ---------- */
async function loadAlbums(){
  $('albums').innerHTML = '<div class="empty">加载中…</div>';
  try {
    const r = await inv('collected_albums');
    ALBUMS = r.items || [];
    $('albums').innerHTML = ALBUMS.length ? ALBUMS.map((a,i) =>
      `<div class="item" data-aid="${a.id}" data-aname="${esc(a.name)}" style="cursor:pointer"><span class="n">${i+1}. ${esc(disp(a.name))}<br><span style="color:var(--muted);font-size:12px">${esc(a.artists)} · ${esc(a.company||'未标注厂牌')}</span></span><span class="c">${a.size} 首 ›</span></div>`
    ).join('') : '<div class="empty">没有收藏专辑</div>';
    document.querySelectorAll('#albums [data-aid]').forEach(el => el.onclick = () => openAlbum(Number(el.dataset.aid), el.dataset.aname));
    setState('albumState', `共 ${ALBUMS.length} 张`, 'ok');
  } catch (e) { $('albums').innerHTML = `<div class="empty">加载失败：${esc(e)}</div>`; }
}

async function exportAlbums(){
  if (!ALBUMS.length) return;
  const head = '序号,专辑,艺人,曲目数,发行公司,发行时间,专辑ID\n';
  const rows = ALBUMS.map((a,i) => {
    const d = a.publishTime ? new Date(a.publishTime).toISOString().slice(0,10) : '';
    const e = v => `"${String(v??'').replace(/"/g,'""')}"`;
    return [i+1, e(a.name), e(a.artists), a.size, e(a.company), d, a.id].join(',');
  }).join('\n');
  try {
    const r = await inv('save_text', { name: '表格/收藏专辑.csv', content: '\ufeff' + head + rows + '\n' });
    setState('albumState', '已导出：' + r.paths.join(' / '), 'ok');
  } catch (e) { setState('albumState', '导出失败：' + e, 'err'); }
}

/* ---------- 排行 ---------- */
async function loadRank(week){
  RANK_WEEK = week;
  document.querySelectorAll('#view-ranking .seg button').forEach(b => b.classList.toggle('on', (b.dataset.r === 'week') === week));
  $('ranking').innerHTML = '<div class="empty">加载中…</div>';
  try {
    const r = await inv('play_record', { uid, week });
    RANK = r.items || [];
    $('ranking').innerHTML = RANK.length ? RANK.map(x =>
      `<div class="item"><span class="n">${x.rank}. ${esc(x.name)}<br><span style="color:var(--muted);font-size:12px">${esc(x.ar)} · ${esc(x.al)}</span></span><span class="c">${x.playCount} 次</span></div>`
    ).join('') : '<div class="empty">没有记录</div>';
    setState('rankState', `共 ${RANK.length} 条`, 'ok');
  } catch (e) { $('ranking').innerHTML = `<div class="empty">加载失败：${esc(e)}</div>`; }
}

async function exportRank(){
  if (!RANK.length) return;
  const head = '排名,播放次数,歌名,制作人/团体,专辑,时长\n';
  const e = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const rows = RANK.map(x => [x.rank, x.playCount, e(x.name), e(x.ar), e(x.al), fmtDur(x.dur)].join(',')).join('\n');
  const name = `表格/听歌排行_${RANK_WEEK ? '最近一周' : '全部时间'}.csv`;
  try {
    const r = await inv('save_text', { name, content: '\ufeff' + head + rows + '\n' });
    setState('rankState', '已导出：' + r.paths.join(' / '), 'ok');
  } catch (e) { setState('rankState', '导出失败：' + e, 'err'); }
}

/* ---------- 视图切换 ---------- */
function switchView(v){
  currentView = v;
  document.querySelectorAll('#mainTabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  ['playlists','albums','favlist','ranking','special'].forEach(k => { $('view-'+k).hidden = k !== v; });
  if (v === 'favlist') renderFavlist();
  if (v === 'special') renderSpecial();
  if (v === 'albums' && !ALBUMS.length) loadAlbums();
  if (v === 'ranking' && !RANK.length) loadRank(false);
}

/* ---------- 事件 ---------- */
$('btnLogin').onclick = startQr;
$('btnPhonePwd').onclick = () => runLogin('login_phone_password', { phone: $('phone').value, password: $('phonePwd').value });
$('btnPhoneSms').onclick = () => runLogin('login_phone_captcha', { phone: $('phone').value, captcha: $('smsCode').value });
$('btnEmail').onclick = () => runLogin('login_email', { email: $('email').value, password: $('emailPwd').value });
$('btnCookie').onclick = () => runLogin('login_cookie', { cookie: $('cookieText').value });
$('btnSmsSent').onclick = async () => {
  const phone = $('phone').value.trim();
  if (!phone) return setState('state','请先填手机号','err');
  setState('state','发送中…');
  try { const r = await inv('sms_sent', { phone }); setState('state', r.message || (r.ok?'已发送':'失败'), r.ok?'ok':'err'); }
  catch (e) { setState('state', String(e), 'err'); }
};
$('btnRefresh').onclick = () => loadPlaylists();
$('btnAllCsv').onclick = () => exportAll('csv');
$('btnAllMd').onclick = () => exportAll('md');
$('btnAlbumCsv').onclick = exportAlbums;
$('btnFavCsv').onclick = exportFavlist;
$('btnAlbumBack').onclick = () => { $('albumDetailCard').hidden = true; $('mainCard').hidden = false; currentAlbum = 0; };
$('btnAlbumExportCsv').onclick = () => exportAlbum('csv');
$('btnAlbumExportMd').onclick = () => exportAlbum('md');
$('btnPrivacy').onclick = togglePrivacy;
document.querySelectorAll('#dispModes button').forEach(b => b.onclick = () => setDisp(b.dataset.d));
$('btnRankCsv').onclick = exportRank;
$('btnZip').onclick = async () => {
  setState('zipState','打包中…');
  try { const r = await inv('zip_exports');
    setState('zipState', `已打包 ${r.files} 个文件，${(r.size/1048576).toFixed(1)} MB\n${r.public || r.path}`, 'ok');
  } catch (e) { setState('zipState','打包失败：'+e,'err'); }
};
$('btnSpecialList').onclick = async () => {
  $('specialList').innerHTML = '<div class="empty">加载中…</div>';
  try {
    const r = await inv('special_items');
    const items = r.items || [];
    $('specialList').innerHTML = items.length ? items.map((it,i) => {
      const kinds = (it.kinds||[]).map(k => ({otherVersion:'其他版本',special:'特殊字符',nonLatin:'非拉丁'}[k]||k)).join(' / ');
      return `<div class="item"><span class="n">${i+1}. ${esc(it.name)}<br><span style="color:var(--muted);font-size:12px">${esc(it.ar)} · ${esc(it.al)} · ${esc(it.company||'未标注厂牌')}</span></span><span class="c">${esc(kinds)}</span></div>`;
    }).join('') : '<div class="empty">暂无明细，先导出歌单</div>';
    setState('specialState', `共 ${r.total} 条`, 'ok');
  } catch (e) { setState('specialState','加载失败：'+e,'err'); }
};
$('btnSpecialCsv').onclick = async () => {
  try { const r = await inv('export_special'); setState('specialState','已导出：'+r.paths.join(' / '),'ok'); }
  catch (e) { setState('specialState','导出失败：'+e,'err'); }
};
$('btnResetStats').onclick = () => { ACC = { down: 0, otherVersion: 0, special: 0, nonLatin: 0, total: 0, playlists: 0 }; renderSpecial(); setState('specialState','已重置'); };
$('btnBack').onclick = () => { $('detailCard').hidden = true; $('mainCard').hidden = false; };
$('btnExportCsv').onclick = async () => {
  if (!currentId) return;
  setState('exportState','导出中…');
  try { const r = await exportOne(currentId,'csv'); accStats(r.stats); setState('exportState','已导出 '+r.count+' 首：'+r.paths.join(' / '),'ok'); }
  catch (e) { setState('exportState','导出失败：'+e,'err'); }
};
$('btnExportMd').onclick = async () => {
  if (!currentId) return;
  setState('exportState','导出中…');
  try { const r = await exportOne(currentId,'md'); accStats(r.stats); setState('exportState','已导出 '+r.count+' 首：'+r.paths.join(' / '),'ok'); }
  catch (e) { setState('exportState','导出失败：'+e,'err'); }
};
$('btnLogout').onclick = async () => {
  await inv('logout');
  $('loginCard').hidden = false; $('mainCard').hidden = true;
  $('sub').textContent = '未登录'; setState('state','已退出登录');
};
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => switchLoginTab(b.dataset.m));
document.querySelectorAll('#mainTabs button').forEach(b => b.onclick = () => switchView(b.dataset.v));
document.querySelectorAll('#view-ranking .seg button').forEach(b => b.onclick = () => loadRank(b.dataset.r === 'week'));
window.addEventListener('beforeunload', stopPoll);

renderSpecial();
checkAccount(true);
</script>
