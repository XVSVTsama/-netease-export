<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>设置 · 网易云导出</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/desk.css">
</head>
<body data-page="settings">
<header class="top">
  <div class="bar">
    <h1>设置</h1>
    <a class="icon-btn" href="/">◎</a>
    <button class="icon-btn" id="privacyBtn">🔒</button>
    <button class="icon-btn" id="themeBtn">☾</button>
  </div>
  <div class="sub">导出目录、账号与存储位置</div>
</header>

<main>
  <section class="section">
    <h2>账号<span class="count" id="accCount"></span></h2>
    <div id="accList"></div>
    <a class="btn" href="/login?acc=new" style="margin-top:10px">＋ 添加账号（扫码）</a>
  </section>

  <section class="section">
    <h2>网络出口</h2>
    <div class="hint">自动检测，不使用任何内置代理，也不修改手机上的代理软件。</div>
    <div class="hint" id="exitInfo" style="margin-top:10px">检测中…</div>
    <button class="btn small" id="exitRefresh" style="margin-top:10px">重新检测</button>
  </section>

  <section class="section">
    <h2>可选导出位置</h2>
    <div class="hint" id="dirHint">点一个目录即可填入上方输入框</div>
    <div class="accs" id="dirs" style="margin-top:8px"></div>
  </section>
</main>

<nav class="tabs">
  <a href="/"><span class="i">◎</span>概览</a>
  <a href="/browse"><span class="i">☰</span>歌单</a>
  <a href="/albums"><span class="i">◫</span>收藏专辑</a>
  <a href="/docs"><span class="i">✳</span>专项</a>
</nav>

<script src="/app.js"></script>
</body>
</html>
