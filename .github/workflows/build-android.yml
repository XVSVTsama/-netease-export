name: build-android

on:
  workflow_dispatch:
  push:
    tags: ['apk-*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" >/dev/null 2>&1 || true
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 安装项目依赖（含 Tauri CLI）
        run: npm install --no-audit --no-fund

      - name: 初始化 Android 工程
        run: npx tauri android init --ci

      - name: 构建 APK（debug，含 debug 签名，可直接安装）
        run: npx tauri android build --apk --debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: netease-export-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
