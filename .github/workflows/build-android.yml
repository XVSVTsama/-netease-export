name: build-android

on:
  workflow_dispatch:
  push:
    tags: ['apk-*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" >/dev/null 2>&1 || true
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 安装项目依赖（含 Tauri CLI）
        run: npm install --no-audit --no-fund

      - name: 界面自检（防脚本解析失败导致按钮全失效）
        run: npm run test:ui

      - name: 初始化 Android 工程
        run: npx tauri android init --ci

      - name: 声明「所有文件访问权限」（导出到 Download 需要）
        run: |
          MAN=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if ! grep -q MANAGE_EXTERNAL_STORAGE "$MAN"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <application|' "$MAN"
          fi
          grep -n "MANAGE_EXTERNAL_STORAGE" "$MAN"

      - name: 目录选择回调（SAF）
        run: |
          MA=$(find src-tauri/gen/android/app/src/main/java -name MainActivity.kt | head -1)
          echo "MainActivity: $MA"
          test -n "$MA"
          python3 - "$MA" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if 'picked_dir' in s:
              print('already patched')
              sys.exit(0)
          method = '''
            fun etaPickFolder() {
              val intent = android.content.Intent(android.content.Intent.ACTION_OPEN_DOCUMENT_TREE)
              intent.addFlags(
                android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION or
                  android.content.Intent.FLAG_GRANT_WRITE_URI_PERMISSION or
                  android.content.Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
              )
              startActivityForResult(intent, 4321)
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: android.content.Intent?) {
              super.onActivityResult(requestCode, resultCode, data)
              if (requestCode == 4321 && resultCode == android.app.Activity.RESULT_OK) {
                val uri = data?.data
                if (uri != null) {
                  try {
                    contentResolver.takePersistableUriPermission(
                      uri,
                      android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION or android.content.Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                    )
                  } catch (_: Exception) {
                  }
                  getSharedPreferences("eta", MODE_PRIVATE).edit().putString("picked_dir", uri.toString()).apply()
                }
              }
            }
          '''
          i = s.rstrip().rfind('}')
          s = s[:i] + method + "\n" + s[i:]
          open(p, 'w').write(s)
          print('patched')
          PY
          grep -n "picked_dir" "$MA"

      - name: 保留 MainActivity 的目录选择方法（防 R8 删掉）
        run: |
          PRO=src-tauri/gen/android/app/proguard-rules.pro
          mkdir -p "$(dirname "$PRO")"
          touch "$PRO"
          if ! grep -q etaPickFolder "$PRO"; then
            printf '%s\n' \
              '-keep class app.xvsvt.netease.export.MainActivity { *; }' \
              '-keepclassmembers class app.xvsvt.netease.export.MainActivity { *; }' >> "$PRO"
          fi
          cat "$PRO"
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          grep -n "isMinifyEnabled" "$GRADLE" || true
          sed -i -E 's/isMinifyEnabled = true/isMinifyEnabled = false/g' "$GRADLE"
          grep -n "isMinifyEnabled" "$GRADLE" || true

      - name: 写入版本号（覆盖安装需要递增 versionCode）
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          PROPS=src-tauri/gen/android/app/tauri.properties
          # Tauri 生成的 gradle 是从 tauri.properties 读版本，只 sed 数字行没用，这里直接改写取值表达式
          sed -i -E "s/versionCode = tauriProperties[^\n]*/versionCode = $CODE/" "$GRADLE"
          sed -i -E "s/versionName = tauriProperties[^\n]*/versionName = \"$VERSION\"/" "$GRADLE"
          sed -i -E "s/versionCode = [0-9]+/versionCode = $CODE/" "$GRADLE"
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"$VERSION\"/" "$GRADLE"
          if [ -f "$PROPS" ]; then
            sed -i -E "s|^tauri.android.versionCode=.*|tauri.android.versionCode=$CODE|" "$PROPS"
            sed -i -E "s|^tauri.android.versionName=.*|tauri.android.versionName=$VERSION|" "$PROPS"
            grep -q '^tauri.android.versionCode=' "$PROPS" || echo "tauri.android.versionCode=$CODE" >> "$PROPS"
            grep -q '^tauri.android.versionName=' "$PROPS" || echo "tauri.android.versionName=$VERSION" >> "$PROPS"
            echo "--- tauri.properties ---"; cat "$PROPS"
          fi
          echo "versionName=$VERSION versionCode=$CODE"
          grep -nE "versionCode|versionName" "$GRADLE"
          # 改写失败就直接失败，不要悄悄用默认 versionCode 出包
          grep -q "versionCode = $CODE" "$GRADLE"

      - name: 构建 APK（release，仅 arm64）
        run: npx tauri android build --apk --target aarch64

      - name: 用仓库内置密钥签名（保证新旧包签名一致，可直接覆盖升级）
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "目标: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          VERSION=$(node -p "require('./package.json').version")
          OUT="netease-export-${VERSION}-arm64.apk"
          "$BT/apksigner" sign \
            --key signing/key.pk8 --cert signing/cert.pem \
            --min-sdk-version 24 \
            --out "$OUT" "$APK"
          "$BT/apksigner" verify --print-certs "$OUT" | head -6
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: netease-export-apk
          path: netease-export-*-arm64.apk
          if-no-files-found: error
